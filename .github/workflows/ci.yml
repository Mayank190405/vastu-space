name: Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend TypeScript & Vite Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript typecheck & Vite build
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Python Engine & Photogrammetry Test Suite
  # -------------------------------------------------------------
  backend-test:
    name: Python Engine Tests (204 Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-api.txt ]; then pip install -r requirements-api.txt; fi
          pip install pytest pydantic numpy scipy

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q --tb=short

  # -------------------------------------------------------------
  # Job 3: Security & Code Hygiene Gate
  # -------------------------------------------------------------
  security-and-hygiene:
    name: Secrets & Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit for committed .env files
        run: |
          if git ls-files | grep -E '^\.env$|\.env\.local'; then
            echo "ERROR: Tracked .env or .env.local file detected in git history!"
            exit 1
          fi
          echo "Clean: No private .env files tracked."

      - name: Verify .env.example exists
        run: |
          test -f .env.example || { echo "Missing .env.example template"; exit 1; }
