# ==============================================================================
# VĀSTU SPATIAL PLATFORM - PRODUCTION REVERSE PROXY GATEWAY
# ==============================================================================

# Client upload buffer & limits (allows 4K capture videos up to 1GB)
client_max_body_size 1024M;
client_body_buffer_size 128M;
client_body_timeout 300s;
proxy_read_timeout 300s;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;

# ------------------------------------------------------------------------------
# HTTP Server (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker Embedded DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gateway Health Check
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"vastu-gateway","timestamp":"$time_iso8601"}\n';
    }

    # Go Backend API
    location /api/v1/ {
        set $backend_upstream "http://vastu-backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads (static file uploads stored in backend)
    location /uploads/ {
        set $backend_upstream "http://vastu-backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python Spatial Computing Control Plane & Photogrammetry Engine
    location /py/ {
        rewrite ^/py/(.*)$ /api/v1/$1 break;
        set $api_upstream "http://vastu-api:8000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python API Documentation
    location ~ ^/(docs|redoc|openapi.json) {
        set $api_upstream "http://vastu-api:8000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO S3 Object Storage Buckets (Direct 3D streaming)
    location ~ ^/(vastu-artifacts|vastu-raw-captures|vastu-exports)/ {
        set $minio_s3 "http://vastu-minio:9000";
        proxy_pass $minio_s3;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # MinIO Web Console (Admin Dashboard)
    location /minio-console/ {
        rewrite ^/minio-console/(.*)$ /$1 break;
        set $minio_console "http://vastu-minio:9001";
        proxy_pass $minio_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React + Three.js Frontend Application
    location / {
        set $frontend_upstream "http://vastu-frontend:80";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
